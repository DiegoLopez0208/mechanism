<!doctype html>
<!-- the card that shows when the link is shared (1200 x 630). Rendered to og.png: open it at 1200 x 630 and take a screenshot. -->
<html lang="en"><head><meta charset="utf-8"><title>mechanism, share card</title>
<style>
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:#0a1828; color:#d6e6f5; font-family:'Inter', system-ui, sans-serif; }
  body { position:relative; display:grid; grid-template-columns:420px 1fr; align-items:center; padding:0 70px; box-sizing:border-box; gap:30px;
    background:linear-gradient(rgba(110,180,230,.09) 1px, transparent 1px) 0 0/48px 48px, linear-gradient(90deg, rgba(110,180,230,.09) 1px, transparent 1px) 0 0/48px 48px, radial-gradient(circle at 24% 50%, #123152 0, #0a1828 62%); }
  body::after { content:''; position:absolute; inset:22px; border:1px solid rgba(110,180,230,.32); pointer-events:none; }
  img { width:380px; height:380px; justify-self:center; }
  .kick { font:600 15px 'JetBrains Mono','Courier New',monospace; letter-spacing:.26em; color:#4fd1ff; margin-bottom:22px; }
  h1 { font:700 70px/1.04 'JetBrains Mono','Courier New',monospace; letter-spacing:-.03em; margin:0 0 26px; text-transform:uppercase; }
  h1 i { color:#4fd1ff; font-style:normal; }
  p { font-size:25px; line-height:1.45; color:#9db6cc; margin:0 0 30px; max-width:600px; }
  .tags { display:flex; gap:12px; margin-bottom:34px; }
  .tags span { font:600 14px 'JetBrains Mono','Courier New',monospace; letter-spacing:.16em; padding:7px 14px; border:1px solid; }
  .url { font:500 16px 'JetBrains Mono','Courier New',monospace; letter-spacing:.06em; color:#7894ae; }
</style></head>
<body>
  <img src="mark.svg" alt="">
  <div>
    <div class="kick">// A SKILL FOR CODING AGENTS</div>
    <h1>Build it from <i>evidence.</i></h1>
    <p>Every number says where it came from. A spec that does not add up is not rendered.</p>
    <div class="tags"><span style="color:#4fd1ff">SPEC</span><span style="color:#d6e6f5">DERIVED</span><span style="color:#ffb347">ESTIMATED</span></div>
    <div class="url">github.com/DiegoLopez0208/mechanism</div>
  </div>
</body></html>
