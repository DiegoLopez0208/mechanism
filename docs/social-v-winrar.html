<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>social preview</title>
<style>
:root{--bg:#07213f;--grid:rgba(120,190,255,.10);--ink:#eaf2ff;--mute:#8fb0d6;--accent:#d9a441;--ok:#3ddc84}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Inter,system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 78% 48%,#0e3868 0%,transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px,var(--bg);position:relative}
.frame{position:absolute;inset:24px;border:1px solid rgba(143,176,214,.35)}
.frame:before,.frame:after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--accent)}
.frame:before{left:-1px;top:-1px;border-right:0;border-bottom:0}.frame:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.left{position:absolute;left:72px;top:64px;width:500px}
.eye{font:600 15px/1 Consolas,"Cascadia Mono",monospace;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
h1{font:800 92px/1 "Segoe UI",Inter,sans-serif;letter-spacing:-.03em;margin:22px 0 22px}
.sub{font-size:25px;line-height:1.3;color:var(--ink);font-weight:500}
.sub b{color:var(--accent);font-weight:700}
.chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.chip{font:600 15px/1 Consolas,"Cascadia Mono",monospace;padding:9px 12px;border:1px solid rgba(143,176,214,.5);color:var(--mute);border-radius:4px;letter-spacing:.04em}
.chip.ok{color:var(--ok);border-color:rgba(61,220,132,.6);background:rgba(61,220,132,.08)}
.foot{position:absolute;left:72px;bottom:54px;font:500 18px/1 Consolas,"Cascadia Mono",monospace;color:var(--mute);letter-spacing:.03em}
.shot{position:absolute;right:64px;top:96px;width:584px;height:372px;border:1px solid rgba(143,176,214,.45);border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.tag{position:absolute;right:64px;top:486px;width:584px;display:flex;justify-content:space-between;font:600 13px/1 Consolas,"Cascadia Mono",monospace;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
.tag span:first-child:before{content:"";display:inline-block;width:10px;height:10px;background:var(--accent);margin-right:8px}
</style></head><body>
<div class="frame"></div>
<div class="left">
  <div class="eye">Claude Code skill</div>
  <h1>mechanism</h1>
  <div class="sub">Build inspectable models from evidence. See what is <b>known</b>, <b>estimated</b> and <b>tested</b>.</div>
  <div class="chips"><span class="chip ok">10 objects VERIFIED</span><span class="chip">film + viewer + 3D model</span><span class="chip">hardware and software</span></div>
</div>
<div class="shot"><img src="media/social-winrar.jpg" alt=""></div>
<div class="tag"><span>WinRAR unpacking, from RFC 1951</span><span>every number sourced</span></div>
<div class="foot">github.com/DiegoLopez0208/mechanism</div>
</body></html>
