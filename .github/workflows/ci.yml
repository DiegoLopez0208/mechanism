name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression tests for the evidence gate
        run: node --test tests/gate.test.mjs
      - name: Every shipped example passes its own gate
        run: |
          for e in hub switch enigma k20a rubik rtx4090 mos6502 rar5 winrar; do
            echo "== $e"
            node scripts/check-spec.mjs examples/$e/spec.js --json /tmp/$e.verdict.json | tail -n 3
          done
      - name: A template that was never filled in must NOT pass
        run: |
          node scripts/new.mjs ci-draft --title "CI draft"
          if node scripts/check-spec.mjs examples/ci-draft/spec.js; then echo "the unfinished template passed the gate"; exit 1; fi
